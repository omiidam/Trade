name: Android Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI and sync
        run: npx cap sync android

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/tradefinex-release.keystore \
            -alias tradefinex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tradefinex123 \
            -keypass tradefinex123 \
            -dname "CN=TradeFinex, OU=Development, O=Qali, L=Tehran, ST=Tehran, C=IR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK exists
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found at $APK_PATH"
            exit 1
          fi
          echo "✅ Release APK found at $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tradefinex-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
